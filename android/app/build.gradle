plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.vision_bridge"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.example.vision_bridge"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    // ML Kit text-recognition script models.
    // CRITICAL: google_mlkit_text_recognition bundles ONLY the Latin model
    // (implementation) — Devanagari/Chinese/Japanese/Korean are declared
    // 'compileOnly' in the plugin, so their native models are NOT packaged in
    // the APK. Using a Devanagari recognizer without this bundled dependency
    // crashes the app natively (no Dart exception) right after a scan.
    // Add other scripts the same way if ever needed.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-iid'
}

